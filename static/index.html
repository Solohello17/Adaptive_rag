<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN TOKENS — restyle from here first.
     Everything below references these. Change these six colors
     and the whole interface moves with you.
     ============================================================ */
  :root {
    --paper:    #FAFAF8;   /* page background */
    --surface:  #FFFFFF;   /* panels, cards */
    --ink:      #16171A;   /* primary text */
    --muted:    #6E6F73;   /* secondary text */
    --line:     #E4E4E0;   /* hairlines, borders */
    --trace:    #2F5D50;   /* THE accent. Used only on the routing trace. */
    --trace-bg: #EEF3F1;
    --fail:     #9A3B2E;

    --font-ui:   'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    --radius: 6px;
    --pane-left: 280px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
    height: 100vh;
    display: grid;
    grid-template-columns: var(--pane-left) 1fr;
  }

  /* ---------- LEFT PANE: what the system knows ---------- */
  .library {
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .library-head {
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--line);
  }
  .wordmark {
    font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
  }
  .wordmark span { color: var(--trace); }
  .library-label {
    margin-top: 18px;
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted);
  }

  .doc-list { flex: 1; overflow-y: auto; padding: 8px 12px; }

  .doc {
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px;
  }
  .doc:last-child { border-bottom: none; }
  .doc-info { flex: 1; min-width: 0; }
  .doc-delete {
    flex-shrink: 0;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--muted); background: none;
    border: 1px solid transparent; border-radius: 4px;
    padding: 3px 6px; cursor: pointer;
  }
  .doc-delete:hover, .doc-delete:focus-visible { color: var(--fail); border-color: var(--line); }
  .doc-delete:disabled { opacity: .5; cursor: default; }
  .doc-name {
    font-size: 13.5px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .doc-meta {
    font-family: var(--font-mono);
    font-size: 11px; color: var(--muted); margin-top: 2px;
  }

  .doc-empty {
    padding: 24px 8px;
    font-size: 13.5px; color: var(--muted);
  }

  .drop {
    margin: 12px;
    padding: 18px 14px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--trace); background: var(--trace-bg); }
  .drop-title { font-size: 13.5px; font-weight: 500; }
  .drop-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .drop input { display: none; }

  /* ---------- RIGHT PANE: the conversation ---------- */
  .conversation {
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .thread {
    flex: 1; overflow-y: auto;
    padding: 40px 0;
  }
  .thread-inner { max-width: 680px; margin: 0 auto; padding: 0 32px; }

  /* Empty state — first impression. Teaches what the thing does. */
  .empty-state { padding-top: 60px; }
  .empty-state h1 {
    font-size: 26px; font-weight: 600; letter-spacing: -0.02em;
    margin-bottom: 10px;
  }
  .empty-state p {
    color: var(--muted); max-width: 46ch; margin-bottom: 28px;
  }
  .try-label {
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin-bottom: 10px;
  }
  .try {
    display: block; width: 100%; text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 11px 14px; margin-bottom: 8px;
    font-family: var(--font-ui); font-size: 14px; color: var(--ink);
    cursor: pointer;
    transition: border-color .15s;
  }
  .try:hover { border-color: var(--trace); }
  .try em {
    display: block; font-style: normal;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--muted); margin-top: 3px;
  }

  /* Messages */
  .turn { margin-bottom: 34px; }
  .question {
    font-size: 17px; font-weight: 500; letter-spacing: -0.01em;
    margin-bottom: 16px;
  }
  .answer { white-space: pre-wrap; }
  .answer.failed { color: var(--fail); }

  /* ---------- SIGNATURE ELEMENT: the routing trace ----------
     A receipt, not a dashboard. One quiet line, expandable.
     This is the only place the accent color appears. */
  .trace {
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 11.5px;
  }
  .trace-line {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 9px;
    background: var(--trace-bg);
    color: var(--trace);
    border-radius: 4px;
    cursor: pointer;
    border: none;
    font-family: inherit; font-size: inherit;
  }
  .trace-line.failed { background: #F6EDEB; color: var(--fail); }
  .trace-caret { transition: transform .15s; display: inline-block; }
  .trace.open .trace-caret { transform: rotate(90deg); }

  .trace-detail { display: none; margin-top: 10px; }
  .trace.open .trace-detail { display: block; }

  .step {
    display: flex; gap: 10px;
    padding: 6px 0 6px 9px;
    border-left: 2px solid var(--line);
    color: var(--muted);
  }
  .step-name { color: var(--ink); min-width: 128px; }
  .step.on { border-left-color: var(--trace); }

  /* v2: who made each decision (route / grade / verify). Part of the trace. */
  .decisions-label {
    margin: 12px 0 4px 11px;
    font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted);
  }
  .decision {
    display: grid;
    grid-template-columns: 58px 44px minmax(0, 1fr) auto;
    gap: 10px;
    padding: 5px 0 5px 9px;
    border-left: 2px solid var(--line);
    color: var(--muted);
  }
  .decision-name { color: var(--ink); }
  .decision-provider { color: var(--trace); }
  .decision-meta { text-align: right; white-space: nowrap; }
  .decision-fallback { grid-column: 3 / -1; color: var(--fail); }
  @media (max-width: 560px) {
    .decision { grid-template-columns: 58px 44px minmax(0, 1fr); }
    .decision-meta { grid-column: 3; text-align: left; }
  }

  /* Thinking state — shows WHICH step, since yours has several */
  .thinking {
    font-family: var(--font-mono); font-size: 11.5px;
    color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--trace);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: .7 } }

  /* ---------- Composer ---------- */
  .composer { border-top: 1px solid var(--line); background: var(--surface); }
  .composer-inner {
    max-width: 680px; margin: 0 auto; padding: 16px 32px 22px;
    display: flex; gap: 10px;
  }
  .composer input {
    flex: 1;
    font-family: var(--font-ui); font-size: 15px; color: var(--ink);
    padding: 11px 14px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper);
  }
  .composer input:focus { outline: 2px solid var(--trace); outline-offset: -1px; border-color: transparent; }
  .composer button {
    padding: 11px 18px;
    font-family: var(--font-ui); font-size: 14px; font-weight: 500;
    color: var(--surface); background: var(--ink);
    border: none; border-radius: var(--radius); cursor: pointer;
  }
  .composer button:disabled { opacity: .4; cursor: default; }

  /* Mock toggle — delete this block once wired to the real API */
  .mockbar {
    position: fixed; bottom: 14px; right: 16px;
    font-family: var(--font-mono); font-size: 11px;
    background: var(--ink); color: var(--surface);
    padding: 6px 10px; border-radius: 4px;
    display: flex; gap: 8px; align-items: center;
  }
  .mockbar button {
    background: none; border: 1px solid rgba(255,255,255,.3);
    color: var(--surface); font-family: inherit; font-size: 10px;
    padding: 2px 6px; border-radius: 3px; cursor: pointer;
  }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    .library { display: none; }
  }
</style>
</head>
<body>

<aside class="library">
  <div class="library-head">
    <div class="wordmark">Adaptive<span>·</span>RAG</div>
    <div class="library-label">Knowledge base</div>
  </div>
  <div class="doc-list" id="docList"></div>
  <label class="drop" id="drop">
    <div class="drop-title">Add a document</div>
    <div class="drop-hint">PDF or text</div>
    <input type="file" id="fileInput" accept=".pdf,.txt">
  </label>
</aside>

<main class="conversation">
  <div class="thread" id="thread">
    <div class="thread-inner" id="threadInner"></div>
  </div>
  <div class="composer">
    <div class="composer-inner">
      <input id="input" placeholder="Ask a question" autocomplete="off">
      <button id="send">Ask</button>
    </div>
  </div>
</main>

<div class="mockbar">
  <span>mock mode</span>
  <button onclick="MOCK=!MOCK;this.textContent=MOCK?'on':'off'">on</button>
</div>

<script>
/* =============================================================
   CONFIG
   ============================================================= */
const API = '';
let MOCK = false;   // flip to false (or use the toggle) to hit your real API

/* =============================================================
   STATE
   ============================================================= */
const docs = [];
const turns = [];
let busy = false;

/* =============================================================
   RENDER
   ============================================================= */
function renderDocs() {
  const el = document.getElementById('docList');
  if (!docs.length) {
    el.innerHTML = '<div class="doc-empty">Nothing indexed yet. Add a document and the router can start using it.</div>';
    return;
  }
  el.innerHTML = docs.map(d => `
    <div class="doc">
      <div class="doc-info">
        <div class="doc-name" title="${esc(d.name)}">${esc(d.name)}</div>
        <div class="doc-meta">${esc(d.chunks)} chunks</div>
      </div>
      <button class="doc-delete" data-delete="${esc(d.id)}" aria-label="Delete ${esc(d.name)}">Delete</button>
    </div>`).join('');
}

function renderThread() {
  const el = document.getElementById('threadInner');

  if (!turns.length) {
    el.innerHTML = `
      <div class="empty-state">
        <h1>Ask, and watch it decide.</h1>
        <p>This assistant picks a source for every question. It reads your documents, searches the web, or answers directly, then checks its own answer before showing it to you.</p>
        <div class="try-label">Try one</div>
        <button class="try" onclick="ask('What does the uploaded report say about Q3 revenue?')">
          What does the uploaded report say about Q3 revenue?
          <em>should route to your documents</em>
        </button>
        <button class="try" onclick="ask('What is the weather in Tokyo right now?')">
          What is the weather in Tokyo right now?
          <em>should route to web search</em>
        </button>
        <button class="try" onclick="ask('What is a vector database?')">
          What is a vector database?
          <em>should answer directly</em>
        </button>
      </div>`;
    return;
  }

  el.innerHTML = turns.map((t, i) => `
    <div class="turn">
      <div class="question">${esc(t.question)}</div>
      ${t.pending
        ? `<div class="thinking"><span class="pulse"></span>${esc(t.step || 'routing')}</div>`
        : `<div class="answer${t.failed ? ' failed' : ''}">${esc(t.answer)}</div>
           ${traceHTML(t, i)}`}
    </div>`).join('');

  document.getElementById('thread').scrollTop = 1e9;
}

/* The signature element. Summary line + expandable steps. */
function traceHTML(t, i) {
  if (!t.trace) return '';
  const s = t.trace;
  const decisions = s.decisions || [];
  const summary = [srcLabel(s.route), s.docsKept != null ? `${s.docsKept}/${s.docsFound} docs kept` : null,
                   s.retries ? `${s.retries} retry` : null,
                   t.failed ? 'no answer' : (s.grounded ? 'grounded' : null),
                   providerLabel(decisions)]
                  .filter(Boolean).join('  ·  ');

  return `
    <div class="trace${t.open ? ' open' : ''}">
      <button class="trace-line${t.failed ? ' failed' : ''}" onclick="toggle(${i})">
        <span class="trace-caret">›</span>${esc(summary)}
      </button>
      <div class="trace-detail">
        ${s.steps.map(st => `
          <div class="step on">
            <span class="step-name">${esc(st.name)}</span>
            <span>${esc(st.detail)}</span>
          </div>`).join('')}
        ${decisions.length ? `<div class="decisions-label">decisions</div>${decisions.map(decisionHTML).join('')}` : ''}
      </div>
    </div>`;
}

/* v2: one row per decision, e.g. "route  jev  documents  0.98 · 784 ms". */
function decisionHTML(d) {
  const meta = [d.confidence != null ? Number(d.confidence).toFixed(2) : null, `${Math.round(d.latency_ms)} ms`]
               .filter(Boolean).join(' · ');
  let fallback = '';
  if (d.fallback_reason) {
    const count = d.fallback_count ? `${d.fallback_count} ` : '';
    fallback = `<span class="decision-fallback">${esc(count)}fell back to llm (${esc(d.fallback_reason.replace(/_/g, ' '))})</span>`;
  }
  return `
    <div class="decision">
      <span class="decision-name">${esc(d.decision)}</span>
      <span class="decision-provider">${esc(d.provider)}</span>
      <span>${esc(d.result)}</span>
      <span class="decision-meta">${esc(meta)}</span>
      ${fallback}
    </div>`;
}

/* Only tag the summary line when Jev was involved, so llm mode looks exactly like v1. */
function providerLabel(decisions) {
  if (!decisions.some(d => d.provider === 'jev' || d.provider === 'mixed')) return null;
  const fallbacks = decisions.reduce((n, d) => n + (d.fallback_count ?? (d.fallback_reason ? 1 : 0)), 0);
  return fallbacks ? `jev, ${fallbacks} fallback${fallbacks > 1 ? 's' : ''}` : 'jev';
}

function srcLabel(r) {
  return { documents: 'documents', code: 'code', web_search: 'web search',
           general_knowledge: 'answered directly' }[r] || r;
}

function toggle(i) { turns[i].open = !turns[i].open; renderThread(); }

/* =============================================================
   ACTIONS
   ============================================================= */
async function ask(q) {
  if (busy || !q.trim()) return;
  busy = true;
  document.getElementById('send').disabled = true;

  const turn = { question: q, pending: true, step: 'routing' };
  turns.push(turn);
  renderThread();

  try {
    const res = MOCK ? await mockQuery(q, turn) : await realQuery(q);
    Object.assign(turn, res, { pending: false });
  } catch (e) {
    Object.assign(turn, {
      pending: false, failed: true,
      answer: (e.message && !e.message.includes('Failed to fetch')) ? e.message : 'Could not reach the backend. Check that the API is running on ' + API + '.',
      trace: null
    });
  }

  busy = false;
  document.getElementById('send').disabled = false;
  renderThread();
}

/* --- REAL API. Your /query response needs to include the trace fields. --- */
async function realQuery(question) {
  const r = await fetch(API + '/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question })
  });
  const data = await r.json();
  
  if (!r.ok) {
    throw new Error(data.detail || `Server error ${r.status}`);
  }

  // Map your backend's response onto the shape the UI draws.
  // Adjust these keys to match what your FastAPI actually returns.
  return {
    answer: data.answer ?? data.generation ?? '(no answer field in response)',
    failed: data.failed ?? false,
    trace: data.route ? {
      route:     data.route,
      docsFound: data.documents_found,
      docsKept:  data.documents_kept,
      grounded:  data.grounded,
      retries:   data.retry_count,
      steps:     data.steps ?? [],
      decisions: data.decisions ?? []
    } : null
  };
}

async function uploadDoc(file) {
  if (MOCK) {
    docs.push({ id: 'mock-' + Date.now(), name: file.name, chunks: 12 + Math.floor(Math.random() * 30) });
    renderDocs();
    return;
  }
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch(API + '/rag/documents/upload', {
    method: 'POST',
    headers: { 'X-Description': file.name },
    body: fd
  });
  const data = await res.json();
  if (!res.ok) {
    alert(data.detail || `Upload failed (${res.status})`);
    return;
  }
  docs.push({ id: data.doc_id, name: data.filename ?? file.name, chunks: data.chunks ?? '—' });
  renderDocs();
}

async function deleteDoc(id, button) {
  const d = docs.find(x => x.id === id);
  if (!d) return;
  if (!confirm(`Delete "${d.name}"?\n\nIts ${d.chunks} chunks will be removed from the knowledge base. This can't be undone.`)) return;

  if (!MOCK) {
    button.disabled = true;
    button.textContent = 'Deleting…';
    const res = await fetch(API + '/rag/documents/' + encodeURIComponent(id), { method: 'DELETE' });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert(data.detail || `Delete failed (${res.status})`);
      button.disabled = false;
      button.textContent = 'Delete';
      return;
    }
  }
  docs.splice(docs.indexOf(d), 1);
  renderDocs();
}

/* Repopulate the knowledge-base list from MongoDB on page load, so
   previously uploaded documents show up after a refresh instead of only
   within the current browser session. */
async function loadDocs() {
  if (MOCK) return;
  try {
    const res = await fetch(API + '/rag/documents');
    if (!res.ok) return;
    const data = await res.json();
    docs.push(...data.map(d => ({ id: d.id, name: d.filename, chunks: d.chunk_count ?? '—' })));
    renderDocs();
  } catch (e) {
    // Backend not reachable yet -- leave the list empty rather than failing the page.
  }
}

/* =============================================================
   MOCK — so you can design against all four states today.
   Delete this whole section once the API is wired.
   ============================================================= */
/* Mock decision rows below are illustrative values, not measurements. */
async function mockQuery(q, turn) {
  const lower = q.toLowerCase();
  const wait = async (ms, step) => { turn.step = step; renderThread(); await new Promise(r => setTimeout(r, ms)); };

  await wait(700, 'routing');

  if (lower.includes('weather') || lower.includes('right now') || lower.includes('latest')) {
    await wait(900, 'searching the web');
    await wait(600, 'generating');
    return { answer: 'Tokyo is currently around 24°C with light cloud cover.',
      trace: { route: 'web_search', grounded: true, retries: 0, steps: [
        { name: 'route', detail: 'needs live information → web search' },
        { name: 'web search', detail: '3 results from Tavily' },
        { name: 'generate', detail: 'answered from search results' },
        { name: 'grounding check', detail: 'passed' }],
        decisions: [
          { decision: 'route',  provider: 'jev', result: 'web_search', confidence: 1, latency_ms: 480 },
          { decision: 'verify', provider: 'jev', result: 'grounded, answers', latency_ms: 690 }]}};
  }

  if (lower.includes('vector database') || lower.startsWith('hello')) {
    await wait(600, 'generating');
    return { answer: 'A vector database stores text as numerical embeddings so you can search by meaning rather than exact keywords.',
      trace: { route: 'general_knowledge', grounded: true, retries: 0, steps: [
        { name: 'route', detail: 'no lookup needed → answer directly' },
        { name: 'generate', detail: 'answered from model knowledge' }],
        decisions: [
          { decision: 'route',  provider: 'llm', result: 'general_knowledge', latency_ms: 2600, fallback_reason: 'low_confidence' },
          { decision: 'verify', provider: 'jev', result: 'answers', latency_ms: 450 }]}};
  }

  if (!docs.length) {
    await wait(700, 'retrieving');
    return { failed: true, answer: 'Nothing in the knowledge base matches this question, and the web search came back empty. Try adding a document that covers it.',
      trace: { route: 'documents', docsFound: 0, docsKept: 0, grounded: false, retries: 1, steps: [
        { name: 'route', detail: 'looks like a document question' },
        { name: 'retrieve', detail: 'knowledge base is empty' },
        { name: 'grade documents', detail: 'nothing to grade' },
        { name: 'web search', detail: 'no usable results' },
        { name: 'retry limit', detail: 'stopped after 1 retry' }]}};
  }

  await wait(800, 'retrieving');
  await wait(700, 'grading documents');
  await wait(700, 'generating');
  return { answer: 'Q3 revenue came in at $4.2M, up 18% from the previous quarter, driven mainly by renewals.',
    trace: { route: 'documents', docsFound: 4, docsKept: 2, grounded: true, retries: 0, steps: [
      { name: 'route', detail: 'matches indexed documents' },
      { name: 'retrieve', detail: '4 chunks from the knowledge base' },
      { name: 'grade documents', detail: '2 relevant, 2 dropped' },
      { name: 'generate', detail: 'answered from 2 chunks' },
      { name: 'grounding check', detail: 'passed' },
      { name: 'answer check', detail: 'passed' }],
      decisions: [
        { decision: 'route',  provider: 'jev',   result: 'documents', confidence: 0.98, latency_ms: 780 },
        { decision: 'grade',  provider: 'mixed', result: '2/4 kept', latency_ms: 3900, fallback_reason: 'rate_limited', fallback_count: 1 },
        { decision: 'verify', provider: 'jev',   result: 'grounded, answers', latency_ms: 720 }]}};
}

/* =============================================================
   WIRING
   ============================================================= */
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.getElementById('send').onclick = () => {
  const i = document.getElementById('input');
  ask(i.value); i.value = '';
};
document.getElementById('input').onkeydown = e => {
  if (e.key === 'Enter') document.getElementById('send').click();
};
document.getElementById('docList').onclick = e => {
  const btn = e.target.closest('[data-delete]');
  if (btn) deleteDoc(btn.dataset.delete, btn);
};
document.getElementById('fileInput').onchange = e => {
  if (e.target.files[0]) uploadDoc(e.target.files[0]);
};
const drop = document.getElementById('drop');
['dragover','dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault();
  drop.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop' && e.dataTransfer.files[0]) uploadDoc(e.dataTransfer.files[0]);
}));

renderDocs();
renderThread();
loadDocs();
</script>
</body>
</html>
